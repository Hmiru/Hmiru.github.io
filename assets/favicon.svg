<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The pitch motif from the site background, reduced to what survives at 16px:
       touchlines, halfway line, centre circle. Boxes and arcs turn to mush at
       that size, so they are left out. The circle is drawn far larger than it
       is on a real pitch; at 16px a true-to-scale one closes up into a dot. -->
  <style>
    .l { fill: none; stroke: #1f8a4c; stroke-width: 2.4; }
    @media (prefers-color-scheme: dark) { .l { stroke: #52c07d; } }
  </style>
  <g class="l">
    <rect x="2.5" y="5" width="27" height="22"/>
    <line x1="16" y1="5" x2="16" y2="27"/>
    <circle cx="16" cy="16" r="6.5"/>
  </g>
</svg>

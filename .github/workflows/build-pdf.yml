name: build PDFs

# The HTML is the source of truth; the PDFs are generated. Rebuild them on
# every content change so the file a recruiter downloads can never drift from
# the page they can read.
#
# No infinite loop: this only triggers on the HTML/build inputs, so the commit
# it pushes back (PDFs only) does not re-trigger it.
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - build.sh
      - .github/workflows/build-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build.sh renders with headless Chrome and exits immediately if it
      # cannot find a browser. The runner image no longer ships one, which is
      # why every run of this workflow failed until now. Install Chrome from
      # Google's own repository rather than depending on whatever the image
      # happens to include this month.
      #
      # pdfinfo / pdftotext back build.sh's page-count and "did it render
      # blank?" checks. Without them the build silently skips both.
      - name: Install Chrome and poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          rm google-chrome-stable_current_amd64.deb
          google-chrome --version

      # Invoked through bash rather than as ./build.sh. The working copy this
      # repository is edited from sits on a mount that reports every file as
      # 0777, so git never sees a real mode change and the executable bit is
      # easy to lose again. This makes the workflow immune to that.
      - name: Build
        run: bash build.sh

      - name: Commit refreshed PDFs
        run: |
          if [ -z "$(git status --porcelain -- '*.pdf')" ]; then
            echo "PDFs already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.pdf
          git commit -m "Rebuild CV and résumé PDFs"
          git push
